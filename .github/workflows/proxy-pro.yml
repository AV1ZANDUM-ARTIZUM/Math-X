name: Math-X Proxy Pro

on:
  push:
    paths:
      - "proxy-pro/**"
      - ".github/workflows/proxy-pro.yml"
  pull_request:
    paths:
      - "proxy-pro/**"
      - ".github/workflows/proxy-pro.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy-pro
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Proxy Pro tests
        run: python -m unittest discover -s tests -v
